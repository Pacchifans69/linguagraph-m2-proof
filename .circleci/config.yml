version: 2.1

jobs:
  m2-exact-candidate-proof:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    environment:
      EXPECTED_PROOF_REPOSITORY: "Pacchifans69/linguagraph-m2-proof"
      EXPECTED_PROOF_BRANCH: "main"
      CANDIDATE_REPOSITORY_URL: "https://github.com/Pacchifans69/LinguaGraph.git"
      EXPECTED_CANDIDATE_REPOSITORY: "Pacchifans69/LinguaGraph"
      EXPECTED_CANDIDATE_BRANCH: "m2-linguistic-segmentation-foundation"
      EXPECTED_CANDIDATE_SHA: "f367f53f0c0de1dcef1f46f62cefbe4fc911d207"
      EXPECTED_CANDIDATE_TREE: "aeddeac9067a710b1c0e473a1c4878f49a3ee79d"
      UV_PYTHON: "3.13"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres"
    steps:
      - checkout
      - run:
          name: "M2 — execute exact-candidate hosted proof"
          no_output_timeout: 20m
          command: |
            mkdir -p proof-artifacts
            set -o pipefail
            bash scripts/run-m2-proof.sh 2>&1 | tee proof-artifacts/command-transcript.log
      - store_artifacts:
          path: proof-artifacts
          destination: m2-external-proof

workflows:
  m2-exact-candidate-proof:
    jobs:
      - m2-exact-candidate-proof:
          filters:
            branches:
              only: main
